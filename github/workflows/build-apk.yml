name: Android Build (Robust)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # Detect project type
      # ----------------------------------------
      - name: Detect project type
        id: detect
        shell: bash
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "type=flutter" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ]; then
            echo "type=react-native" >> $GITHUB_OUTPUT
          elif [ -f "android/settings.gradle" ] || [ -f "android/settings.gradle.kts" ] || [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "type=native" >> $GITHUB_OUTPUT
          else
            echo "type=unknown" >> $GITHUB_OUTPUT
          fi

      # ----------------------------------------
      # Setup Java
      # ----------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ----------------------------------------
      # Setup Android SDK
      # ----------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ----------------------------------------
      # React Native
      # ----------------------------------------
      - name: Setup Node
        if: steps.detect.outputs.type == 'react-native'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        if: steps.detect.outputs.type == 'react-native'
        run: npm ci

      - name: Build React Native APK
        if: steps.detect.outputs.type == 'react-native'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # ----------------------------------------
      # Flutter
      # ----------------------------------------
      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        if: steps.detect.outputs.type == 'flutter'
        run: flutter pub get

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        run: flutter build apk --debug

      # ----------------------------------------
      # Native Android
      # ----------------------------------------
      - name: Build Native APK
        if: steps.detect.outputs.type == 'native'
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found"
            exit 1
          fi

      # ----------------------------------------
      # Unknown project type
      # ----------------------------------------
      - name: Fail if unknown project
        if: steps.detect.outputs.type == 'unknown'
        run: |
          echo "Could not detect project type."
          echo "Missing Flutter, React Native, or Android Gradle files."
          exit 1

      # ----------------------------------------
      # Upload APK artifacts
      # ----------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
